[project]
name = "redwan-portfolio-backend"
version = "1.0.0"
description = "FastAPI backend for the Redwan Ahmed Khan portfolio CMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1; platform_python_implementation=='CPython'",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP046"]  # pydantic generics require the classic Generic[T] base

[tool.ruff.lint.per-file-ignores]
"app/db/seed.py" = ["E501"]      # seeded prose content is naturally long
"tests/*" = ["E501"]            # readable long assertions
"app/models/__init__.py" = ["E501"]  # dense column definitions

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
